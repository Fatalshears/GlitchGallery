# Test the code examples referenced by [!tested] and [!mwe] callouts in the wiki
name: Examples

on:
  push:
    paths: ["examples/**", ".github/workflows/examples.yml"]
  pull_request:
    paths: ["examples/**", ".github/workflows/examples.yml"]
  workflow_dispatch:

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/download-manager/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: examples/download-manager/smoke_test.sh

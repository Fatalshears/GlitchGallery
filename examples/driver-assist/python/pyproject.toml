[project]
name = "drivekit"
version = "0.1.0"
description = "Reference driver-assistance building blocks for the GlitchGallery wiki (educational, not for vehicles)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

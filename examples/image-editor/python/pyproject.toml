[project]
name = "pixkit"
version = "0.1.0"
description = "Reference raster image-editing engine for the GlitchGallery wiki"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
io = ["Pillow>=10"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
